New remaining problems / next suspects

	1.	AknIconServer HLE opcode 0x2 is unsupported
	●	Repeats many times during the V9 clean run.
	●	Current V7 HLE completes it as KErrNotSupported (-5).
	●	This is now a strong next candidate for V10 because V9 removed the previous fatal -6 signature.
	●	Do NOT blindly no-op it until its expected request/response ABI is identified. Compare against native AknIcon behavior on v111 if possible.
	2.	Repeated Leave -5 / Leave -19 and Unknown thread state to wake up
	●	Often appears around the AknIcon unsupported-opcode loop.
	●	Determine which service/call actually owns each leave before patching.
	3.	One V5 SVCMISS: svc=0xE8
	●	Seen in V9 clean run.
	●	Lower priority because v111 known-good testing also exhibited SVC 0xE8 while Fruit Ninja still ran.
	4.	Graphics issues remain
	●	early Invalid bitmap handle to draw warnings still occur.
	●	Corrupted graphics command list! Emulation halt. appears late in EKA2L1_TakeThis around teardown/after the run.
	●	Treat as separate graphics lifetime/teardown issue unless video/log proves it terminates gameplay earlier.
	5.	ALF streamer
	●	Remains diagnostic/compatibility debt, but no longer P0 because the same core ALF opcodes appear on v111 where Fruit Ninja runs.

