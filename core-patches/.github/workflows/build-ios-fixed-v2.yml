V9 — FBS BitmapCreate ABI fix for epoc95

File of interest: src/emu/services/src/fbs/impls/bitmap.cpp

V8 proved the critical failure on v025.007 was:

	●	server !Fontbitmapserver
	●	opcode 0x0E = BitmapCreate
	●	client sent 28-byte Anna/Belle bmp_specs_v2
	●	old epoc95 branch parsed it as 24-byte legacy-modern layout
	●	game immediately hit Leave -6 / KErrArgument and was killed.

V9 fixes this by selecting the 28-byte bmp_specs_v2 contract for epoc95+ when the packet size indicates it, and writing bitmap handles back to IPC slot 1 (Anna/Belle ABI). 24-byte clients keep the older contract.

Marker:
V9 FBS95 CREATE: layout=v2 ... writeback_slot=1

