name: Build NGAGE-MACHINE1-AC

on:
  workflow_dispatch:
  push:
    branches:
      - ngage-machine1
    paths-ignore:
      - ".github/workflows/build-ngage-machine1.yml"

permissions:
  contents: read

concurrency:
  group: ngage-machine1-y
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-26
    env:
      EKA2L1_IOS_CONFIGURATION: Release
      EKA2L1_IOS_DYNARMIC: "OFF"
      UPSTREAM_REF: c5ae62d9c667f6e7060d76be58a2614122a629a4
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout MACHINE1 control repo
        uses: actions/checkout@v7
        with:
          path: control

      - name: Checkout EKA2L1 upstream baseline
        uses: actions/checkout@v7
        with:
          repository: EKA2L1/EKA2L1
          ref: ${{ env.UPSTREAM_REF }}
          fetch-depth: 1
          submodules: false
          path: source

      - name: Checkout upstream submodules shallow
        run: |
          set -euo pipefail
          git -C source submodule sync --recursive
          git -C source submodule update --init --recursive --depth 1 --recommend-shallow --jobs 8

      - name: Record baselines
        run: |
          set -euo pipefail
          cd source
          echo "upstream_head=$(git rev-parse HEAD)" | tee ../UPSTREAM-BASELINE.txt
          cd ../control
          {
            echo "controller_head=$(git rev-parse HEAD)"
            echo "branch=ngage-machine1"
            echo "milestone=MACHINE1-AC"
            echo "target=Nokia N-Gage QD RH-29"
            echo "rom=RH-29 V04.10 SYM.ROM"
            echo "rom_status=DEVICE PASS (HLE import/boot/apps + FIFA 05 playable)"
          } | tee ../MACHINE1-BASELINE.txt

      - name: Run MACHINE1 controller tests
        working-directory: control
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_apply_ngage_machine1 -v
          c++ -std=c++17 -Wall -Wextra -pedantic -Imachine1/include \
            machine1/src/rh29_machine_model.cpp \
            machine1/tests/rh29_machine_model_tests.cpp \
            -o /tmp/rh29_machine_model_tests
          /tmp/rh29_machine_model_tests
          c++ -std=c++17 -Wall -Wextra -pedantic -Imachine1/include \
            machine1/src/rh29_machine_model.cpp \
            machine1/src/rh29_machine_runner.cpp \
            machine1/tests/rh29_report_tests.cpp \
            -DRH29_MACHINE1_REPORT_ONLY \
            -o /tmp/rh29_report_tests
          /tmp/rh29_report_tests

      - name: Apply HYBRIDHOME-UPSTREAM1
        run: python3 control/scripts/apply_hybridhome_upstream1.py source

      - name: Apply VPL firmware importer
        run: python3 control/scripts/apply_vpl_firmware.py source

      - name: Apply Vietnamese localization
        run: python3 control/scripts/apply_vietnamese_ios.py source

      - name: Apply NGAGE MACHINE1-AC
        run: python3 control/scripts/apply_ngage_machine1.py source

      - name: Static contract
        run: |
          set -euo pipefail

          # Preserve known-good product path.
          grep -q 'HYBRIDHOME3' source/src/emu/ios/App/S60HybridHomeView.swift
          grep -q 'firmwareCode.caseInsensitiveCompare("RM-356")' source/src/emu/ios/App/ContentView.swift
          grep -q 'app.lavender1865.valley8348.*FORCE' source/src/emu/ios/CMakeLists.txt
          grep -q 'installDeviceWithVplPath' source/src/emu/ios/Bridge/IosEmulator.h
          grep -q '"vi"' source/src/emu/ios/Resources/Localizable.xcstrings

          # MACHINE1-AC must be present only as an opt-in RH-29 research path.
          grep -q 'RH29_MACHINE1_AC' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'runRH29MachineProbeWithInstructionBudget' source/src/emu/ios/Bridge/IosEmulator.h
          grep -q 'caseInsensitiveCompare:@"RH-29"' source/src/emu/ios/Bridge/IosEmulator.mm
          grep -q 'roms/rh-29/SYM.ROM' source/src/emu/ios/Bridge/IosEmulator.mm
          grep -q 'RH-29 Machine Probe' source/src/emu/ios/App/ContentView.swift
          grep -q 'RH29MachineProbeView.swift' source/src/emu/ios/CMakeLists.txt
          grep -q 'PrivilegeMode initial_mode' source/src/emu/cpu/include/cpu/dyncom/arm_dyncom.h
          grep -q 'dyncom_core(monitor, page_bits, USER32MODE)' source/src/emu/cpu/src/dyncom/arm_dyncom.cpp
          grep -q 'ARMul_State>(this, initial_mode)' source/src/emu/cpu/src/dyncom/arm_dyncom.cpp
          grep -q 'SVC32MODE' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q '0x000000D3u' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'cold_reset_pc' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'synthetic_rom_alias_hypothesis' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'is_observed_arm920t_control_write' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'observed_arm920t_c1_write_0x1272_mmu_off' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'candidate_sdram_base' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'write_initialized_only' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'wd2_rh29_128mbit_candidate_write_tracked' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'observed_mmio_write_address = 0x0C150004u' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'exact_observed_write_only' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'second_flash_base = 0x02000000u' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'observed_flash_command_value = 0x00FFu' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'exact_observed_command_write_only' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'observed_flash_id_entry_address = 0x0200AAAAu' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'observed_flash_id_entry_value = 0x0090u' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'FLASH_ID_ENTRY_POLICY' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'amd_reference_manufacturer_id = 0x0001u' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'amd_rh29_reference_variant_manufacturer_only' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'amd_reference_device_id = 0x277Eu' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'amd_29bds064j_rh29_reference_word1_only' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'observed_flash_id_exit_value = 0x00F0u' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'amd_f0_exit_autoselect_to_read_array' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'FLASH_AUTOSELECT_ACTIVE_AT_STOP' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'observed_flash_unlock1_address = second_flash_base + 0x00000AAAu' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'observed_flash_unlock1_value = 0x00AAu' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'amd_x16_unlock_cycle1_observed' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'FLASH_UNLOCK_STAGE_AT_STOP' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'observed_flash_unlock2_address = second_flash_base + 0x00000554u' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'observed_flash_unlock2_value = 0x0055u' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'amd_x16_unlock_cycle2_observed_stage1_only' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'observed_flash_unlock_autoselect_value = 0x0090u' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'amd_x16_unlock_stage2_command_0x90' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'FLASH_UNLOCK_AUTOSELECT_ACCEPTED_COUNT' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'A32_TRACE_POLICY=last_64_with_pointer_registers_no_device_fabrication' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'a32_trace_capacity = 64' source/src/emu/ios/Bridge/RH29MachineRunner.h
          grep -q 'candidate_ram_probe_base = 0x0A000000u' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'candidate_ram_probe_size = 16u' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'candidate_ram_probe_stride = 0x0000003Cu' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'candidate_ram_probe_loop_windows = 8u' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'candidate_bootstrap_copy_size = 0x108u' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'candidate_bootstrap_copy_pc = 0x00002344u' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'candidate_bootstrap_stack_push_size = 0x20u' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'candidate_bootstrap_stack_push_pc = 0x000011A8u' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'candidate_bootstrap_stack_push_instruction = 0xE92D47F0u' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'candidate_bootstrap_nested_stack_push_size = 0x10u' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'candidate_bootstrap_nested_stack_push_pc = 0x000022A0u' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'candidate_bootstrap_nested_stack_push_lr = 0x000011C8u' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'candidate_bootstrap_nested_stack_push_instruction = 0xE92D4070u' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'candidate_bootstrap_post_copy_mutation_pc = 0x000011D4u' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'candidate_bootstrap_post_copy_mutation_lr = 0x000022C4u' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'candidate_bootstrap_post_copy_mutation_instruction = 0xE5803008u' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'candidate_bootstrap_post_copy_mutation_value = 0xB2800021u' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'BOOTSTRAP_COPY_POLICY' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'Y_device_r11_0x744_r2_0x42_exact_write32_pc_0x2344_lr_0x3c8_initialized_readback_only' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'Z_device_sp_base_plus_0xff0_exact_first_stmdb_32bytes_pc_0x11a8_lr_0x3c8_initialized_readback_only' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'AA_device_sp_0x0a000fbc_exact_second_stmdb_16bytes_pc_0x22a0_lr_0x11c8_initialized_readback_only' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'AB_device_exact_existing_word_writeback_addr_0x0a000010_pc_0x11d4_lr_0x22c4_value_0xb2800021_initialized_copy_only' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'BOOTSTRAP_POST_COPY_MUTATION_ACCEPTED_COUNT' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'Label("Chia sẻ báo cáo"' source/src/emu/ios/App/RH29MachineProbeView.swift
          grep -q 'candidate_post_probe_workspace_base' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'candidate_post_probe_workspace_size = 0x20u' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'low_vector_shadow_base = 0x00000000u' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'low_vector_shadow_size = 9u \* sizeof(std::uint32_t)' source/src/emu/ios/Bridge/RH29MachineModel.h
          grep -q 'symbian_boot_eight_step_sparse_loop_stride_0x3c' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'post_probe_0x20_candidate_zero_seeded_mutable' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'POST_RAM_WORKSPACE_READ_COUNT' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'POST_RAM_WORKSPACE_WRITE_COUNT' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'arm_low_vectors_36byte_rom_seeded_mutable_write32' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'LOW_VECTOR_SHADOW_READ_COUNT' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'LOW_VECTOR_SHADOW_WRITE_COUNT' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'LOW_VECTOR_SHADOW_STATUS=X_admits_only_W_observed_write_at_0x20_0x24_plus_fail_closed' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'SDRAM_WRITE_TRACE_POLICY=first_16_exact_transactions_no_new_mapping' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'candidate_sdram_write_trace_count' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'EARLY_SETUP_TRACE_POLICY=pc_0x00000B00_0x00000B7F_all_r0_r12_no_model_change' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'early_setup_trace_pc_begin = 0x00000B00u' source/src/emu/ios/Bridge/RH29MachineRunner.h
          grep -q 'early_setup_trace_pc_end = 0x00000B80u' source/src/emu/ios/Bridge/RH29MachineRunner.h
          grep -q 'full_a32_trace_entry' source/src/emu/ios/Bridge/RH29MachineRunner.h
          grep -q 'low_page_trace_capacity = 4096u' source/src/emu/ios/Bridge/RH29MachineRunner.h
          grep -q 'callsite_trace_pc_begin = 0x00000300u' source/src/emu/ios/Bridge/RH29MachineRunner.h
          grep -q 'setup_literal_pool_begin = 0x00000B90u' source/src/emu/ios/Bridge/RH29MachineRunner.h
          grep -q 'MACHINE1_W_DIAG_POLICY=no_memory_response_change_no_remap_assumption' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'LOW_PAGE_TRACE_POLICY=low_4k_all_guest_bus_callbacks_no_response_change' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'CP15_TRACE_POLICY=all_condition_passed_p15_seen_before_barrier' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'SETUP_B68_INSTRUCTION_INDEX_BEFORE' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'RAM_PROBE_READ_COUNT' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'RAM_PROBE_WRITE_COUNT' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q '(p + "R8")' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q 'RH29_MACHINE1_AC.txt' source/src/emu/ios/App/RH29MachineProbeView.swift
          grep -q 'Reg_nonfiq_r8_r12' source/src/emu/cpu/include/cpu/dyncom/armstate.h
          grep -q 'Reg_nonfiq_r8_r12.begin(), Reg_nonfiq_r8_r12.end()' source/src/emu/cpu/src/dyncom/armstate.cpp
          grep -q 'Reg.begin() + 13, Reg_nonfiq_r8_r12.begin()' source/src/emu/cpu/src/dyncom/armstate.cpp
          grep -q '(p + "R11")' source/src/emu/ios/Bridge/RH29MachineRunner.cpp
          grep -q '@State private var instructionBudget: UInt32 = 10_000' source/src/emu/ios/App/RH29MachineProbeView.swift

          git -C source diff --check
          echo "HYBRIDHOME3 + VPL + Vietnamese + MACHINE1-AC static contract PASS"

      - name: Install and configure ccache
        run: |
          set -euo pipefail
          brew install ccache
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size=1G
          ccache --zero-stats
          ccache --show-config | grep -E 'cache_dir|max_size'

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ngage-machine1-dcache-${{ runner.os }}-ios16-dyncom-${{ env.UPSTREAM_REF }}-${{ github.sha }}
          restore-keys: |
            ngage-machine1-dcache-${{ runner.os }}-ios16-dyncom-${{ env.UPSTREAM_REF }}-
            hybridhome-upstream1-ccache-${{ runner.os }}-ios16-dyncom-${{ env.UPSTREAM_REF }}-

      - name: Restore incremental Xcode build
        uses: actions/cache@v6
        with:
          path: source/build/ios-device
          key: ngage-machine1-xcode-v2-${{ runner.os }}-ios16-dyncom-${{ env.UPSTREAM_REF }}-${{ github.sha }}
          restore-keys: |
            ngage-machine1-xcode-v2-${{ runner.os }}-ios16-dyncom-${{ env.UPSTREAM_REF }}-
            ngage-machine1-ycode-${{ runner.os }}-ios16-dyncom-${{ env.UPSTREAM_REF }}-
            hybridhome-upstream1-xcode-${{ runner.os }}-ios16-dyncom-${{ env.UPSTREAM_REF }}-

      - name: Normalize source mtimes for true incremental build
        run: |
          set -euo pipefail
          cd source

          # A fresh checkout gives every source file a new mtime. That makes
          # cached Xcode/CMake objects look stale and causes an unnecessary
          # near-full rebuild. Record only files changed by our patch stack.
          git diff --name-only -z > /tmp/eka-machine1-changed.z
          git ls-files --others --exclude-standard -z > /tmp/eka-machine1-untracked.z

          # Make untouched upstream files older than the restored build cache.
          while IFS= read -r -d '' f; do
            if [ -f "$f" ]; then
              touch -t 202001010000 "$f"
            fi
          done < <(git ls-files -z)

          # Re-touch only files MACHINE1/HYBRIDHOME/VPL/VI actually changed.
          while IFS= read -r -d '' f; do
            if [ -f "$f" ]; then
              touch "$f"
            fi
          done < /tmp/eka-machine1-changed.z

          while IFS= read -r -d '' f; do
            if [ -f "$f" ]; then
              touch "$f"
            fi
          done < /tmp/eka-machine1-untracked.z

          echo "Incremental mtime normalization PASS"
          echo "Tracked files changed by patch stack:"
          git diff --name-only | wc -l
          echo "Untracked generated MACHINE1 files:"
          git ls-files --others --exclude-standard | wc -l

      - name: Cache iOS ffmpeg
        uses: actions/cache@v6
        with:
          path: source/src/external/ffmpeg/ios/device
          key: hybridhome-upstream1-ffmpeg-ios-device-v1

      - name: Build upstream iOS + MACHINE1-AC
        working-directory: source
        env:
          EKA2L1_IOS_DEPLOYMENT_TARGET: "16.0"
          EKA2L1_IOS_CONFIGURATION: Release
        run: ./scripts/build_ios.sh device

      - name: Verify Bundle identifier
        run: |
          set -euo pipefail
          APP="source/build/ios-device/src/emu/ios/Release-iphoneos/EKA2L1.app"
          ACTUAL=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          test "$ACTUAL" = "app.lavender1865.valley8348"
          echo "Bundle identifier PASS (ESign-match ROM access): $ACTUAL"

      - name: Verify Vietnamese resources
        run: |
          set -euo pipefail
          APP="source/build/ios-device/src/emu/ios/Release-iphoneos/EKA2L1.app"
          test -f "$APP/vi.lproj/Localizable.strings"
          test -f "$APP/vi.lproj/InfoPlist.strings"
          /usr/bin/plutil -p "$APP/vi.lproj/Localizable.strings" | grep -q 'Thiết bị'
          echo "Vietnamese resources PASS"

      - name: Report compiler cache
        if: always()
        run: |
          ccache --show-stats || true
          du -sh "$CCACHE_DIR" || true

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="source/build/ios-device/src/emu/ios/Release-iphoneos/EKA2L1.app"
          test -d "${app}"
          mkdir -p out/Payload
          cp -R "${app}" out/Payload/
          (
            cd out
            zip -qry EKA2L1-NGAGE-MACHINE1-AC-unsigned.ipa Payload
          )

      - name: Upload NGAGE MACHINE1-AC IPA
        uses: actions/upload-artifact@v7
        with:
          name: EKA2L1-NGAGE-MACHINE1-AC-IPA
          path: out/EKA2L1-NGAGE-MACHINE1-AC-unsigned.ipa
          if-no-files-found: error
